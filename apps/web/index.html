<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/frameyard.svg" />
    <script>
      (function () {
        try {
          var apply = function (mode) {
            var resolved =
              mode === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
                : mode;
            var root = document.documentElement;
            root.style.colorScheme = resolved;
            root.dataset.kbTheme = resolved;
            return mode;
          };
          var stored = localStorage.getItem("kb-color-mode");
          if (stored) apply(stored);
          else localStorage.setItem("kb-color-mode", apply("dark"));
        } catch (e) {}

        if (window.desktop) {
          document.documentElement.dataset.platform = window.desktop.platform;
          if (window.desktop.platform === "darwin") {
            document.documentElement.dataset.boot = "1";
          }
        }
      })();
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      html[data-boot="1"] #boot-splash {
        display: flex;
      }

      #boot-splash svg {
        width: 48px;
        height: 48px;
      }
    </style>
    <link href="/src/index.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frameyard</title>
    <meta name="description" content="Local video and motion editing with editable layers, timelines and coding agents." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Frameyard | Video and motion editing" />
    <meta property="og:description" content="Local video and motion editing with editable layers, timelines and coding agents." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Frameyard | Video and motion editing" />
    <meta name="twitter:description" content="Local video and motion editing with editable layers, timelines and coding agents." />
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 51V13H51M17 32H43M36 51H51V40" stroke="#F2F2F2" stroke-width="6" stroke-linecap="square"/>
      </svg>
    </div>

    <script type="module" src="/src/index.tsx"></script>

</html>
