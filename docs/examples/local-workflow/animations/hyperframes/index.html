<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>HyperFrames title</title>
<script src="gsap.min.js"></script>
<style>body{margin:0;color:#fff;font-family:Inter,sans-serif}#root{position:relative;width:1920px;height:1080px;overflow:hidden}.clip{position:absolute;inset:0;background:#172554;display:flex;align-items:center;justify-content:center}h1{margin:0;font-size:132px;line-height:1.2}#bar{position:absolute;left:520px;top:670px;width:880px;height:8px;background:#67e8f9;transform-origin:left center}</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
<section id="scene" class="clip" data-start="0" data-duration="3" data-track-index="1"><h1 id="title">HyperFrames</h1><div id="bar"></div></section></div>
<script>const tl=gsap.timeline({paused:true});tl.fromTo('#title',{y:60,opacity:0},{y:0,opacity:1,duration:0.65,ease:'power3.out'},0);tl.fromTo('#bar',{scaleX:0},{scaleX:1,duration:0.7,ease:'power2.out'},0.4);window.__timelines={main:tl};</script></body></html>
